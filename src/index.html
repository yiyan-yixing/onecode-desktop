<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneCode</title>
  <link rel="stylesheet" href="static/xterm.css">
  <link rel="stylesheet" href="static/hljs.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="wizard.css">
</head>
<body>
  <!-- Cowork Shell: titlebar + content + statusbar -->
  <div class="app" id="app">

    <!-- Title Bar -->
    <div class="titlebar" id="titlebar" data-tauri-drag-region>
      <button class="titlebar-btn on" id="sidebarToggle" title="折叠/展开侧边栏 (⌘B)" aria-expanded="true">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="12" height="12" rx="2"/>
          <rect class="sb-left" x="3" y="3" width="2.5" height="10" rx="1" stroke="none"/>
          <line class="sb-divider" x1="5.5" y1="2" x2="5.5" y2="14"/>
        </svg>
      </button>
      <span class="titlebar-spacer"></span>
      <span class="titlebar-filename" id="titlebarFilename"></span>
      <button class="titlebar-btn titlebar-close-preview" id="titlebarClosePreview" title="关闭预览 (⎋)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" y1="4" x2="12" y2="12"/><line x1="12" y1="4" x2="4" y2="12"/>
        </svg>
      </button>
      <button class="titlebar-btn" id="titlebarOpenVscode" title="用 VS Code 打开当前目录">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 4l3.5-2 6 5 2.5-2v8l-2.5-2-6 5L3 12z"/>
          <path d="M12.5 5v6" stroke-width="1.1"/>
        </svg>
      </button>
      <button class="titlebar-btn" id="rightPanelToggle" title="折叠/展开右侧边栏 (⇧⌘F)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="12" height="12" rx="2"/>
          <rect class="sb-right" x="10.5" y="3" width="2.5" height="10" rx="1" stroke="none"/>
          <line class="sb-divider" x1="10.5" y1="2" x2="10.5" y2="14"/>
        </svg>
      </button>
    </div>

    <!-- Main Content: Sidebar + Terminal -->
    <div class="content">
      <!-- Sidebar (warm, left) -->
      <nav class="sidebar" id="orbital"></nav>

      <!-- Terminal Panel (dark) -->
      <div class="term-panel">
        <div class="term-viewport" id="termViewport"></div>
        <!-- Empty state: 初始加上 .on 类，避免启动时只有深色背景 -->
        <div class="term-empty on" id="termEmpty">
          <div class="empty-orb" id="emptyOrb">
            <span class="empty-orb-icon">{ }</span>
          </div>
          <div class="empty-title">一人公司的 AI 员工调度台</div>
          <div class="empty-subtitle">一个窗口同时跑 N 个 AI 员工，各司其职、永不掉线。</div>
          <div class="empty-actions">
            <button class="empty-btn primary" id="emptyNewTerm">新建终端</button>
            <button class="empty-btn" id="emptyPalette">⌘K 命令面板</button>
          </div>
          <div class="empty-recent" id="emptyRecent"></div>
        </div>
      </div>

      <!-- File Panel (warm, right) -->
      <aside class="sidebar sidebar-right collapsed" id="filePanel">
        <div class="fe-tabs">
          <button class="fe-tab active" data-tab="file">文件</button>
        </div>
        <!-- File Tab Content -->
        <div class="fe-tab-content active" id="feTabFile"></div>
      </aside>
    </div>

    <!-- Status Bar — 状态点 + 计数 + 健康告警 + CC 徽章；快捷键迁移至菜单栏 -->
    <footer class="statusbar" id="ribbon">
      <div class="statusbar-item">
        <span class="statusbar-dot" id="ribbonDot"></span>
        <span id="ribbonStatus">就绪</span>
      </div>
      <span class="ribbon-warn" id="healthWarn"></span>
      <div class="statusbar-item" id="ribbonCount">0</div>
      <span class="ribbon-backend" id="ribbonBackend">
        <span class="ribbon-backend-dot" id="ribbonBackendDot"></span>
        <span id="ribbonBackendLabel">CC</span>
        <span class="ribbon-model" id="ribbonModelLabel"></span>
      </span>
      <div class="ribbon-badges" id="ribbonBadges"></div>
      <div class="statusbar-spacer"></div>
    </footer>
  </div>

  <!-- Floating: Command Palette (Cmd+K) -->
  <div class="palette-overlay" id="paletteOverlay">
    <div class="palette" id="palette">
      <div class="palette-search">
        <input type="text" class="palette-input" id="paletteInput" placeholder="输入命令或搜索…" autocomplete="off" spellcheck="false">
      </div>
      <div class="palette-results" id="paletteResults"></div>
      <div class="palette-footer">
        <span class="palette-hint"><kbd>↑↓</kbd> 切换  <kbd>↵</kbd> 选择  <kbd>⎋</kbd> 关闭</span>
      </div>
    </div>
  </div>

  <!-- Floating: @Mention Portal -->
  <div class="mention-portal" id="mentionPortal"></div>

  <!-- Floating: Notification Ripples -->
  <div class="ripple-layer" id="rippleLayer"></div>

  <!-- xterm.js + addons (UMD globals) -->
  <script src="static/xterm.min.js"></script>
  <script src="static/addon-fit.min.js"></script>
  <script src="static/addon-web-links.min.js"></script>

  <!-- Markdown + code highlight (File Explorer preview) -->
  <script src="static/marked.min.js"></script>
  <script src="static/highlight.min.js"></script>

  <script type="module" src="main.js"></script>
</body>
</html>
